; ══════════════════════════════════════════════════════════════
; Sécurité PHP — Directives personnalisées
; Dernière mise à jour : 2026-07-04
; ══════════════════════════════════════════════════════════════

; --- Masquer PHP ---
expose_php = Off

; --- Erreurs (jamais en production) ---
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; --- Protection des sessions ---
session.cookie_httponly = On
session.cookie_secure = On
session.use_strict_mode = On
session.cookie_samesite = Lax
session.name = WPSESSID
session.use_only_cookies = On
session.use_trans_sid = Off

; --- Restriction d'accès au système de fichiers ---
; WordPress + uploads + tmp (pour les uploads) + PHP config + extensions
open_basedir = /var/www/html:/tmp:/usr/local/etc/php:/usr/local/lib/php

; --- Désactiver les fonctions dangereuses ---
; NOTE : curl_* et fsockopen sont volontairement ABSENTS — nécessaires pour les mises à jour WP et certains plugins
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,parse_ini_file,show_source,pcntl_exec,pcntl_fork

; --- Limiter les uploads ---
upload_max_filesize = 16M
post_max_size = 16M

; --- Limiter le temps d'exécution ---
max_execution_time = 30
max_input_time = 30
memory_limit = 256M
