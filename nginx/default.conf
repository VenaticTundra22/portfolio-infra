# ── Rate Limiting (protection brute-force) ──
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

# ── Bloc 1 : Redirection HTTP → HTTPS ──
server {
    listen 80;
    server_name venatictundra22.com www.venatictundra22.com;
    server_tokens off;

    # Challenge ACME (renouvellement futur)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Tout le reste → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Bloc 2 : HTTPS (le vrai site) ──
server {
    listen 443 ssl;
    server_name venatictundra22.com www.venatictundra22.com;
    server_tokens off;

    # ── Certificats SSL ──
    ssl_certificate     /etc/letsencrypt/live/venatictundra22.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/venatictundra22.com/privkey.pem;

    # ── Sécurité SSL (bonnes pratiques) ──
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # ── Headers de sécurité ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: https:; frame-ancestors 'none';" always;

    # ── Bloquer les fichiers cachés ──
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── WordPress via PHP-FPM ──
    root /var/www/html;
    index index.php index.html;

    # ── Rate Limiting : wp-login.php (5 tentatives/min) ──
    location = /wp-login.php {
        limit_req zone=login burst=3 nodelay;
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}
